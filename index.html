<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GK Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:white;
}

/* ================= INTRO ================= */
.intro{
  position:fixed;
  inset:0;
  background:#050505;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:fadeOut 2.5s forwards;
}

.intro h1{
  font-family:'Orbitron';
  font-size:90px;
  color:#ff2b2b;
}

@keyframes fadeOut{
  0%{opacity:1;}
  80%{opacity:1;}
  100%{opacity:0;visibility:hidden;}
}

/* ================= WRAPPER ================= */
.wrapper{
  max-width:1100px;
  margin:auto;
  padding:100px 20px;
}

/* ================= HERO ================= */
.hero{
  background:rgba(255,255,255,0.04);
  padding:30px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
}

.hero h1{
  font-family:'Orbitron';
  font-size:60px;
}

.highlight{
  color:#ff2b2b;
}

/* ================= BUTTONS ================= */
button{
  background:linear-gradient(135deg,#ff2020,#700000);
  border:none;
  padding:12px 18px;
  border-radius:12px;
  color:white;
  cursor:pointer;
}

/* ================= CARDS ================= */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.card{
  background:rgba(255,255,255,0.04);
  padding:20px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
}

/* ================= TIMELINE ================= */
.timeline-item{
  background:rgba(255,255,255,0.04);
  padding:16px;
  margin:10px 0;
  border-left:3px solid red;
  border-radius:14px;
}

/* ================= ADMIN ================= */
.admin-panel{
  margin-top:20px;
  padding:20px;
  background:rgba(255,0,0,0.08);
  border-radius:20px;
  border:1px solid rgba(255,0,0,0.2);
  display:none;
}

/* ================= ANIMATION ================= */
.fade-in{
  animation:fadeIn 0.8s ease forwards;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<!-- INTRO -->
<div class="intro">
  <h1>GK</h1>
</div>

<div class="wrapper">

  <!-- HERO -->
  <div class="hero fade-in">
    <h1>GK <span class="highlight">EXCLUSIVE</span></h1>
    <p>Creator Platform</p>

    <input type="password" id="pw" placeholder="Admin Code">
    <button onclick="adminLogin()">Login</button>
  </div>

  <!-- PODCAST CARDS -->
  <div class="grid fade-in">

    <div class="card">GK Podcast</div>
    <div class="card">RedZone FM</div>
    <div class="card">Lappen & Wischmopp</div>

  </div>

  <!-- TIMELINE -->
  <div class="hero fade-in" style="margin-top:20px;">
    <h2>📅 Timeline</h2>
    <div id="timeline"></div>
    <button onclick="addEvent()">+ Event</button>
  </div>

  <!-- ADMIN -->
  <div class="admin-panel" id="adminPanel">
    <h3>👑 Admin Mode aktiv</h3>
    <p>Du kannst jetzt Timeline bearbeiten</p>
  </div>

</div>

<script>

let admin = false;

let data = [
  {title:"GK Matchday", text:"Behind the scenes", date:"2026-05-24"},
  {title:"RedZone FM", text:"Neue Folge", date:"2026-05-20"},
  {title:"VIP Drop", text:"Secret Content", date:"2026-05-18"}
];

/* INTRO AUTO HIDE */
setTimeout(()=>{
  document.querySelector(".intro").style.display="none";
},2500);

/* ADMIN LOGIN */
function adminLogin(){
  const pw = document.getElementById("pw").value;

  if(pw === "GKADMIN"){
    admin = true;
    document.getElementById("adminPanel").style.display="block";
    alert("Admin aktiviert 🔥");
  } else {
    alert("Falsches Passwort");
  }
}

/* SORT TIMELINE */
function sortData(){
  return data.sort((a,b)=> new Date(b.date) - new Date(a.date));
}

/* RENDER */
function render(){
  const box = document.getElementById("timeline");
  box.innerHTML = "";

  sortData().forEach(item => {

    const div = document.createElement("div");
    div.className = "timeline-item";

    div.innerHTML = `
      <small style="opacity:0.6;">📅 ${item.date}</small>
      <h3>${item.title}</h3>
      <p>${item.text}</p>
    `;

    box.appendChild(div);

  });

}

/* ADD EVENT */
function addEvent(){

  if(!admin){
    alert("Nur Admin!");
    return;
  }

  const title = prompt("Titel?");
  const text = prompt("Text?");
  const date = prompt("Datum (YYYY-MM-DD)?");

  data.push({title,text,date});
  render();
}

/* INIT */
render();

</script>

</body>
</html>
