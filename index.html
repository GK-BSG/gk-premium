<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GK Premium Timeline</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ========== BASE ========== */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:white;
}

/* ========== INTRO ========== */
.intro{
  position:fixed;
  inset:0;
  background:#050505;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Orbitron';
  font-size:80px;
  color:red;
  animation:fadeOut 2.5s forwards;
  z-index:999;
}

@keyframes fadeOut{
  0%{opacity:1;}
  100%{opacity:0;visibility:hidden;}
}

/* ========== WRAPPER ========== */
.wrapper{
  max-width:1100px;
  margin:auto;
  padding:100px 20px;
}

/* ========== HERO ========== */
.hero{
  background:rgba(255,255,255,0.04);
  padding:30px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
}

.hero h1{
  font-family:'Orbitron';
  font-size:60px;
}

.highlight{color:#ff2b2b;}

/* ========== INPUTS ========== */
input{
  padding:10px;
  margin:5px 0;
  background:#111;
  border:1px solid #333;
  color:white;
  border-radius:10px;
  width:100%;
}

/* ========== BUTTON ========== */
button{
  background:linear-gradient(135deg,#ff2020,#700000);
  border:none;
  padding:10px 14px;
  border-radius:12px;
  color:white;
  cursor:pointer;
  margin-top:10px;
}

/* ========== CARDS ========== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:22px;
  border-radius:20px;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-8px);
  border-color:rgba(255,50,50,0.3);
}

/* ========== TIMELINE ========== */
.timeline{
  margin-top:20px;
  padding-left:30px;
  border-left:3px solid rgba(255,0,0,0.4);
}

.item{
  background:rgba(255,255,255,0.05);
  margin:12px 0;
  padding:15px;
  border-radius:14px;
  position:relative;
}

.item::before{
  content:"";
  position:absolute;
  left:-38px;
  top:18px;
  width:14px;
  height:14px;
  background:red;
  border-radius:50%;
  box-shadow:0 0 10px red;
}

/* ========== ADMIN ========== */
.admin-box{
  margin-top:15px;
  padding:15px;
  background:rgba(255,0,0,0.08);
  border-radius:15px;
  display:none;
}

.delete{
  margin-top:10px;
  background:rgba(255,0,0,0.3);
}

</style>
</head>

<body>

<div class="intro">GK</div>

<div class="wrapper">

  <!-- HERO -->
  <div class="hero">
    <h1>GK <span class="highlight">EXCLUSIVE</span></h1>

    <input type="password" id="pw" placeholder="Admin Code">
    <button onclick="login()">Login</button>

    <div id="adminBox" class="admin-box">
      👑 Admin aktiviert

      <input id="title" placeholder="Titel">
      <input id="text" placeholder="Text">
      <input id="date" type="date">

      <button onclick="addEvent()">+ Event hinzufügen</button>
    </div>
  </div>

  <!-- CARDS -->
  <div class="grid" style="margin-top:20px;">
    <div class="card">🎙 GK Podcast</div>
    <div class="card">📡 RedZone FM</div>
    <div class="card">🧹 Lappen & Wischmopp</div>
  </div>

  <!-- TIMELINE -->
  <div class="hero" style="margin-top:20px;">
    <h2>📅 Timeline</h2>
    <div class="timeline" id="timeline"></div>
  </div>

</div>

<script>

/* ========== SUPABASE ========== */
const supabaseUrl = "https://ckaonmswhtejbrofecje.supabase.co";
const supabaseKey = "DEIN_SERVICE_ROLE_KEY_HIER"; // besser später in Backend verstecken

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* ========== STATE ========== */
let admin = false;

/* ========== INTRO ========== */
setTimeout(()=>{
  document.querySelector(".intro").style.display="none";
},2500);

/* ========== LOGIN ========== */
function login(){
  if(document.getElementById("pw").value === "GKADMIN"){
    admin = true;
    document.getElementById("adminBox").style.display="block";
  }
  load();
}

/* ========== LOAD ========== */
async function load(){
  const { data } = await supabase
    .from("timeline")
    .select("*")
    .order("date", { ascending: false });

  render(data);
}

/* ========== ADD ========== */
async function addEvent(){
  if(!admin) return;

  await supabase.from("timeline").insert([{
    title: document.getElementById("title").value,
    text: document.getElementById("text").value,
    date: document.getElementById("date").value
  }]);

  load();
}

/* ========== DELETE ========== */
async function del(id){
  if(!admin) return;

  await supabase.from("timeline").delete().eq("id", id);
  load();
}

/* ========== REALTIME ========== */
supabase
  .channel("timeline-channel")
  .on("postgres_changes",
    { event: "*", schema: "public", table: "timeline" },
    () => load()
  )
  .subscribe();

/* ========== RENDER ========== */
function render(data){
  const box = document.getElementById("timeline");
  box.innerHTML = "";

  data.forEach(item=>{
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${item.title}</b><br>
      ${item.text}<br>
      📅 ${item.date}
      ${admin ? `<br><button class="delete" onclick="del('${item.id}')">Delete</button>` : ""}
    `;

    box.appendChild(div);
  });
}

/* INIT */
load();

</script>

</body>
</html>
