<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GoalkeeperKickoff Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:
  radial-gradient(circle at top left, rgba(255,0,0,0.18), transparent 35%),
  radial-gradient(circle at bottom right, rgba(120,0,0,0.22), transparent 40%),
  #050505;
  color:white;
  overflow-x:hidden;
}

/* ================= INTRO ================= */
.intro-screen{
  position:fixed;
  inset:0;
  background:#050505;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:introFade 3.5s forwards;
}

.intro-logo{
  font-family:'Orbitron',sans-serif;
  font-size:120px;
  font-weight:900;
  color:#ff2b2b;
  text-shadow:0 0 25px rgba(255,0,0,0.45);
  animation:pulse 2s infinite alternate;
}

.intro-text{
  margin-top:15px;
  letter-spacing:5px;
  opacity:0.7;
}

@keyframes pulse{
  from{transform:scale(0.95);}
  to{transform:scale(1.05);}
}

@keyframes introFade{
  0%{opacity:1;}
  80%{opacity:1;}
  100%{opacity:0;visibility:hidden;}
}

/* ================= LAYOUT ================= */
.wrapper{
  max-width:1200px;
  margin:auto;
  padding:120px 20px;
}

/* HERO */
.hero{
  background:rgba(10,10,10,0.75);
  border:1px solid rgba(255,0,0,0.15);
  border-radius:30px;
  padding:40px;
  backdrop-filter:blur(15px);
}

.hero h1{
  font-family:'Orbitron';
  font-size:70px;
}

.highlight{
  color:#ff2b2b;
}

.hero p{
  margin-top:15px;
  opacity:0.7;
  max-width:700px;
}

/* BUTTONS */
button{
  background:linear-gradient(135deg,#ff2020,#700000);
  border:none;
  padding:12px 18px;
  border-radius:12px;
  color:white;
  cursor:pointer;
  margin:5px;
}

button:hover{
  transform:translateY(-2px);
}

/* LOGIN */
input{
  padding:12px;
  border-radius:10px;
  border:none;
  margin:5px;
}

/* SECTIONS */
.section{
  margin-top:25px;
  background:rgba(255,255,255,0.04);
  padding:20px;
  border-radius:20px;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.1);
}

/* TIMELINE */
.timeline-item{
  background:#111;
  padding:15px;
  margin:10px 0;
  border-left:4px solid red;
  border-radius:10px;
}

/* MOBILE */
@media(max-width:768px){
  .hero h1{font-size:40px;}
  .intro-logo{font-size:70px;}
}

</style>
</head>

<body>

<!-- INTRO -->
<div class="intro-screen">
  <div class="intro-logo">GK</div>
  <div class="intro-text">GoalkeeperKickoff Exclusive</div>
</div>

<div class="wrapper">

  <div class="hero">
    <h1>GK <span class="highlight">EXCLUSIVE</span></h1>
    <p>Willkommen im GK Premium Bereich mit Podcasts, Projekten und exklusiven Inhalten.</p>

    <div id="loginArea">
      <input type="password" id="password" placeholder="Premium Code">
      <button onclick="login()">VIP Login</button>
    </div>
  </div>

  <!-- VIP CONTENT -->
  <div id="vipContent" style="display:none;">

    <!-- PODCAST -->
    <div class="section">
      <h2>🎙 Podcasts</h2>

      <div class="grid">
        <div class="card">GK Podcast</div>
        <div class="card">RedZone FM</div>
        <div class="card">Lappen & Wischmopp</div>
      </div>
    </div>

    <!-- TIMELINE -->
    <div class="section">
      <h2>📅 Timeline</h2>

      <div id="timeline"></div>

      <!-- ADMIN PANEL (NUR UNTEN!) -->
      <div style="margin-top:15px;">
        <button onclick="adminLogin()">👑 Admin</button>
        <button onclick="addItem()">➕ Add</button>
        <button onclick="exportJSON()">💾 Export</button>
      </div>

    </div>

  </div>

</div>

<script>

const VIP = "GK2026";
const ADMIN = "GKADMIN2026";

let isAdmin = false;
let data = [];

/* VIP LOGIN */
function login(){
  if(document.getElementById("password").value === VIP){
    document.getElementById("vipContent").style.display = "block";
    document.getElementById("loginArea").style.display = "none";
    load();
  } else alert("Falsch");
}

/* LOAD */
async function load(){
  const res = await fetch("https://raw.githubusercontent.com/GK-BSG/gk-premium/main/timeline.json");
  data = await res.json();
  render();
}

/* RENDER */
function render(){

  const box = document.getElementById("timeline");
  box.innerHTML = "";

  data.forEach((item,i)=>{

    const div = document.createElement("div");
    div.className = "timeline-item";

    div.innerHTML = `
      <h3 contenteditable="${isAdmin}">${item.title}</h3>
      <p contenteditable="${isAdmin}">${item.text}</p>
      ${isAdmin ? `<button onclick="del(${i})">❌</button>` : ""}
    `;

    box.appendChild(div);

  });

  if(isAdmin){

    document.querySelectorAll("h3").forEach((el,i)=>{
      el.oninput = () => data[i].title = el.innerText;
    });

    document.querySelectorAll("p").forEach((el,i)=>{
      el.oninput = () => data[i].text = el.innerText;
    });

  }

}

/* ADMIN */
function adminLogin(){
  const pw = prompt("Admin Passwort:");
  if(pw === ADMIN){
    isAdmin = true;
    alert("Admin aktiv 🔥");
    render();
  }
}

/* ADD */
function addItem(){
  if(!isAdmin) return;
  data.push({title:"Neu",text:"Beschreibung"});
  render();
}

/* DELETE */
function del(i){
  data.splice(i,1);
  render();
}

/* EXPORT */
function exportJSON(){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "timeline.json";
  a.click();
}

/* START NOTHING */

</script>

</body>
</html>
