<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GK Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= BASE ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:white;
}

/* ================= INTRO ================= */
.intro{
  position:fixed;
  inset:0;
  background:#050505;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Orbitron';
  font-size:80px;
  color:red;
  animation:fadeOut 2.5s forwards;
}

@keyframes fadeOut{
  0%{opacity:1;}
  100%{opacity:0;visibility:hidden;}
}

/* ================= WRAPPER ================= */
.wrapper{
  max-width:1100px;
  margin:auto;
  padding:100px 20px;
}

/* ================= HERO ================= */
.hero{
  background:rgba(255,255,255,0.04);
  padding:30px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
}

.hero h1{
  font-family:'Orbitron';
  font-size:60px;
}

.highlight{color:#ff2b2b;}

/* ================= BUTTON ================= */
button{
  background:linear-gradient(135deg,#ff2020,#700000);
  border:none;
  padding:10px 14px;
  border-radius:12px;
  color:white;
  cursor:pointer;
  margin-top:10px;
}

/* ================= CARDS ================= */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:22px;
  border-radius:20px;
  transition:0.3s;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top left, rgba(255,0,0,0.2), transparent 60%);
  opacity:0;
  transition:0.4s;
}

.card:hover{
  transform:translateY(-8px) scale(1.02);
  border-color:rgba(255,50,50,0.3);
}

.card:hover::before{
  opacity:1;
}

/* ================= TIMELINE ================= */
.timeline{
  position:relative;
  margin-top:20px;
  padding-left:30px;
  border-left:3px solid rgba(255,0,0,0.4);
}

.timeline-item{
  position:relative;
  background:rgba(255,255,255,0.04);
  padding:16px;
  margin:15px 0;
  border-radius:14px;
  transition:0.3s;
}

.timeline-item:hover{
  transform:translateX(6px);
}

/* Punkt */
.timeline-item::before{
  content:"";
  position:absolute;
  left:-40px;
  top:18px;
  width:14px;
  height:14px;
  background:red;
  border-radius:50%;
  box-shadow:0 0 10px red;
}

/* ================= DELETE BUTTON ================= */
.delete-btn{
  margin-top:10px;
  background:rgba(255,0,0,0.3);
}

/* ================= ADMIN ================= */
.admin-panel{
  margin-top:20px;
  padding:15px;
  background:rgba(255,0,0,0.08);
  border-radius:15px;
  display:none;
}

</style>
</head>

<body>

<div class="intro">GK</div>

<div class="wrapper">

  <!-- HERO -->
  <div class="hero">
    <h1>GK <span class="highlight">EXCLUSIVE</span></h1>

    <input type="password" id="pw" placeholder="Admin Code">
    <button onclick="login()">Login</button>

    <div id="adminPanel" class="admin-panel">
      👑 Admin aktiv
    </div>
  </div>

  <!-- CARDS -->
  <div class="grid" style="margin-top:20px;">
    <div class="card">🎙 GK Podcast</div>
    <div class="card">📡 RedZone FM</div>
    <div class="card">🧹 Lappen & Wischmopp</div>
  </div>

  <!-- TIMELINE -->
  <div class="hero" style="margin-top:20px;">
    <h2>📅 Timeline</h2>

    <div class="timeline" id="timeline"></div>

    <button onclick="addEvent()">+ Event</button>
  </div>

</div>

<script>

let admin = false;

let data = [
  {title:"GK Matchday", text:"Behind the scenes", date:"2026-05-24"},
  {title:"RedZone FM", text:"Neue Folge", date:"2026-05-20"},
  {title:"VIP Drop", text:"Secret Content", date:"2026-05-18"}
];

/* INTRO */
setTimeout(()=>{
  document.querySelector(".intro").style.display="none";
},2500);

/* LOGIN */
function login(){
  if(document.getElementById("pw").value === "GKADMIN"){
    admin = true;
    document.getElementById("adminPanel").style.display="block";
    render();
  }
}

/* SORT */
function sortData(){
  return data.sort((a,b)=> new Date(b.date)-new Date(a.date));
}

/* RENDER */
function render(){
  const box = document.getElementById("timeline");
  box.innerHTML = "";

  sortData().forEach((item,index)=>{

    const div = document.createElement("div");
    div.className = "timeline-item";

    div.innerHTML = `
      <small style="opacity:0.6;">📅 ${item.date}</small>
      <h3>${item.title}</h3>
      <p>${item.text}</p>

      ${admin ? `<button class="delete-btn" onclick="del(${index})">🗑 Löschen</button>` : ""}
    `;

    box.appendChild(div);

  });
}

/* ADD */
function addEvent(){
  if(!admin) return alert("Nur Admin!");

  const title = prompt("Titel?");
  const text = prompt("Text?");
  const date = prompt("Datum (YYYY-MM-DD)?");

  data.push({title,text,date});
  render();
}

/* DELETE */
function del(i){
  data.splice(i,1);
  render();
}

/* INIT */
render();

</script>

</body>
</html>
